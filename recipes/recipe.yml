name: curiosity
description: curiosity killed the cat, but its not dead yet

base-image: ghcr.io/bootcrew/arch-bootc
image-version: latest 

modules:
  - type: files
    files:
      - source: system
        destination: / 

  - type: script
    scripts:
      - preset-cachyos.sh

  - type: script
    secrets:
      - type: env
        name: NTFY_TOPIC
        mount:
          type: env
          name: NTFY_TOPIC
    snippets:
      - 'curl -s -d "CachyOS Preset installed!" -H "Title: Layer Complete" -H "Tags: hourglass" "ntfy.sh/$NTFY_TOPIC" || true'

  - type: pacman
    install:
      packages:
        - base-devel
        - expac
        - git
        - curl
        - sudo
        - mold
        - yazi  
        - nvim 
        - unzip
        - libarchive
        - ripgrep 
        - sd
        - fd 
        - fzf 
        - bat 
        - eza
        - scx-scheds 
        - scx-tools
        - composefs
        - podman
        - cachyos/yay

  - type: script
    secrets:
      - type: env
        name: NTFY_TOPIC
        mount:
          type: env
          name: NTFY_TOPIC
    snippets:
      - 'curl -s -d "Base pacman apps installed!" -H "Title: Layer Complete" -H "Tags: hourglass" "ntfy.sh/$NTFY_TOPIC" || true'
    scripts:
      - setup-yay-user.sh
      - setup-v3-gaslight.sh

  - type: script
    secrets:
      - type: env
        name: NTFY_TOPIC
        mount:
          type: env
          name: NTFY_TOPIC
    snippets:
      - 'curl -s -d "yay installed!" -H "Title: Layer Complete" -H "Tags: hourglass" "ntfy.sh/$NTFY_TOPIC" || true'

  - type: kargs
    kargs:
      - mitigations=off
      - nowatchdog
      - nvidia_drm.modeset=1
      - nvidia_drm.fbdev=1

  - type: script
    scripts:
      - prepare-repository-packages.sh

  # === Hardware, Kernel & Power ===
  # Keep packages that may affect drivers, firmware, or initramfs in one transaction.
  - type: pacman
    install:
      packages:
        - nvidia-prime
        - lib32-nvidia-utils
        - vulkan-intel
        - vulkan-icd-loader
        - lib32-vulkan-icd-loader
        - intel-media-driver
        - intel-ucode
        - lib32-mesa
        - mangohud
        - lib32-mangohud
        - sof-firmware
        - cachyos-settings
        - nohang
        - fwupd
        - cachyos/bpftune-git
        - thermald
  - type: script
    secrets: &ntfy-secret
      - type: env
        name: NTFY_TOPIC
        mount:
          type: env
          name: NTFY_TOPIC
    snippets:
      - 'curl -s -d "Hardware, kernel, and power packages installed!" -H "Title: Layer Complete" -H "Tags: hourglass" "ntfy.sh/$NTFY_TOPIC" || true'

  # === System Utils ===
  - type: pacman
    install:
      packages:
        - btop
        - inxi
        - lshw
        - bind
        - smartmontools
        - compsize
        - btrfsmaintenance
        - fuse-overlayfs
        - fuse2
        - zram-generator
        - keyd
        - evtest
        - opentabletdriver
        - xorg-xhost
        - udiskie
        - gnome-keyring
        - libnotify
        - upower
        - power-profiles-daemon
  - type: script
    secrets: *ntfy-secret
    snippets:
      - 'curl -s -d "System utility packages installed!" -H "Title: Layer Complete" -H "Tags: hourglass" "ntfy.sh/$NTFY_TOPIC" || true'

  # === Desktop & WM ===
  - type: pacman
    install:
      packages:
        - hyprland
        - greetd
        - accountsservice
        - cliphist
        - wl-clipboard
        - hyprsunset
        - nwg-displays
        - xdg-desktop-portal-gtk
        - xdg-desktop-portal-hyprland
        - xdg-user-dirs
        - xdg-utils
        - qt6ct-kde
        - qt6-wayland
        - switcheroo-control
        - adw-gtk-theme
        - papirus-icon-theme
        - cachyos-extra-v3/noctalia
        - cachyos/noctalia-greeter
  - type: script
    secrets: *ntfy-secret
    snippets:
      - 'curl -s -d "Desktop and WM packages installed!" -H "Title: Layer Complete" -H "Tags: hourglass" "ntfy.sh/$NTFY_TOPIC" || true'

  # === Browsers ===
  - type: pacman
    install:
      packages:
        - zen-browser-bin
  - type: script
    secrets: *ntfy-secret
    snippets:
      - 'curl -s -d "Browser packages installed!" -H "Title: Layer Complete" -H "Tags: hourglass" "ntfy.sh/$NTFY_TOPIC" || true'

  # === Audio Stack ===
  - type: pacman
    install:
      packages:
        - pipewire
        - pipewire-pulse
        - pipewire-alsa
        - wireplumber
        - alsa-utils
        - pavucontrol
        - easyeffects
        - lsp-plugins
        - mpd
        - mpd-mpris
        - rmpc
        - mpv
        - mpv-mpris
        - ffmpeg
        - ffmpegthumbnailer
        - spotify
        - spicetify-cli
        - cava
  - type: script
    secrets: *ntfy-secret
    snippets:
      - 'curl -s -d "Audio packages installed!" -H "Title: Layer Complete" -H "Tags: hourglass" "ntfy.sh/$NTFY_TOPIC" || true'

  # === Fonts ===
  - type: pacman
    install:
      packages:
        - apple-fonts
        - inter-font
        - ttf-roboto
        - ttf-twemoji
        - noto-fonts
        - noto-fonts-cjk
        - noto-fonts-emoji
        - ttf-nerd-fonts-symbols
        - ttf-nerd-fonts-symbols-common
  - type: script
    secrets: *ntfy-secret
    snippets:
      - 'curl -s -d "Font packages installed!" -H "Title: Layer Complete" -H "Tags: hourglass" "ntfy.sh/$NTFY_TOPIC" || true'

  # === Shell & Terminal ===
  - type: pacman
    install:
      packages:
        - fish
        - fisher
        - atuin
        - zoxide
        - starship
        - kitty
  - type: script
    secrets: *ntfy-secret
    snippets:
      - 'curl -s -d "Shell and terminal packages installed!" -H "Title: Layer Complete" -H "Tags: hourglass" "ntfy.sh/$NTFY_TOPIC" || true'

  # === CLI Tools (AI + Personal) ===
  - type: pacman
    install:
      packages:
        - ast-grep
        - dust
        - procs
        - jc
        - go-yq
        - htmlq
        - ripgrep-all
        - yt-dlp
        - tealdeer
        - trash-cli
        - ouch
        - trippy
        - httpie
        - bc
        - rsync
        - wget
        - openbsd-netcat
        - 7zip
        - unrar
        - zip
  - type: script
    secrets: *ntfy-secret
    snippets:
      - 'curl -s -d "CLI tool packages installed!" -H "Title: Layer Complete" -H "Tags: hourglass" "ntfy.sh/$NTFY_TOPIC" || true'

  # === Dev Tools ===
  - type: pacman
    install:
      packages:
        - github-cli
        - uv
        - python-rich
        - python-tomli-w
        - libxcrypt-compat
  - type: script
    secrets: *ntfy-secret
    snippets:
      - 'curl -s -d "Development packages installed!" -H "Title: Layer Complete" -H "Tags: hourglass" "ntfy.sh/$NTFY_TOPIC" || true'

  # === Networking ===
  - type: pacman
    install:
      packages:
        - networkmanager
        - iwd
        - bluez
        - bluez-utils
        - blueman
        - wireguard-tools
        - tailscale
        - samba
        - dnsmasq
        - bridge-utils
        - vde2
  - type: script
    secrets: *ntfy-secret
    snippets:
      - 'curl -s -d "Networking packages installed!" -H "Title: Layer Complete" -H "Tags: hourglass" "ntfy.sh/$NTFY_TOPIC" || true'

  # === Virtualization ===
  - type: pacman
    install:
      packages:
        - qemu-full
        - libvirt
        - virt-manager
        - virt-viewer
        - edk2-ovmf
        - swtpm
  - type: script
    secrets: *ntfy-secret
    snippets:
      - 'curl -s -d "Virtualization packages installed!" -H "Title: Layer Complete" -H "Tags: hourglass" "ntfy.sh/$NTFY_TOPIC" || true'

  # === Gaming ===
  - type: pacman
    install:
      packages:
        - steam
        - moonlight-qt
        - mgba-qt
        - emulationstation-de
  - type: script
    secrets: *ntfy-secret
    snippets:
      - 'curl -s -d "Gaming packages installed!" -H "Title: Layer Complete" -H "Tags: hourglass" "ntfy.sh/$NTFY_TOPIC" || true'

  # === Personal Apps ===
  - type: pacman
    install:
      packages:
        - celluloid
        - vesktop
        - obsidian
        - foliate
        - aria2
        - freedownloadmanager
        - gdu
        - imv
        - opencode
  - type: script
    secrets: *ntfy-secret
    snippets:
      - 'curl -s -d "Personal applications installed!" -H "Title: Layer Complete" -H "Tags: hourglass" "ntfy.sh/$NTFY_TOPIC" || true'

  - type: script 
    scripts:
      - install-personal.sh 

  - type: script 
    secrets:
      - type: env
        name: NTFY_TOPIC
        mount:
          type: env
          name: NTFY_TOPIC
    snippets:
      - 'curl -s -d "AUR and personal packages installed!" -H "Title: Layer Complete" -H "Tags: hourglass" "ntfy.sh/$NTFY_TOPIC" || true'
    scripts:
      - cleanup-yay-user.sh

  - type: systemd 
    system: 
      enabled: 
        - bluetooth 
        - power-profiles-daemon 
        - greetd 
        - NetworkManager
        - fstrim.timer
        - smartd
        - bootc-fetch-apply-updates.timer
        - systemd-resolved
        - keyd
        - thermald 
        - switcheroo-control
        - scx_loader
        - nohang-desktop
        - bpftune
        - curiosity-battery-threshold.service
        - virtqemud.socket 
        - virtnetworkd.socket 
        - virtnodedevd.socket 
        - virtstoraged.socket
      disabled:
        - systemd-networkd
    user:
      enabled:
        - mpd
        - mpd-mpris

  - type: script
    scripts:
      - finalize-boot.sh

  - type: script
    secrets:
      - type: env
        name: NTFY_TOPIC
        mount:
          type: env
          name: NTFY_TOPIC
    snippets:
      - 'curl -s -d "Exporting layers..." -H "Title: Layer Complete" -H "Tags: hourglass" "ntfy.sh/$NTFY_TOPIC" || true'
