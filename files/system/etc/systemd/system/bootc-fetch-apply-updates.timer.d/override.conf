[Unit]
# Clear the Red Hat dracut condition since Arch mkinitcpio doesn't create it
ConditionPathExists=

[Timer]
# Clear any and all default schedules
OnCalendar=
OnBootSec=
OnUnitInactiveSec=
# Clear the fleet-scale random delay (default 2h) so timer fires exactly at OnBootSec
RandomizedDelaySec=0

# Set exactly one trigger: 15 minutes after boot
OnBootSec=15min
